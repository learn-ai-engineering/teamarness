[package]
name = "teamarness-repo-aware-package"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
gix = { version = "0.87", default-features = false, features = ["status", "sha1", "sha256", "parallel"] }
serde.workspace = true
serde_json.workspace = true
teamarness-package-protocol = { path = "../../../crates/teamarness-package-protocol" }
teamarness-package-sdk = { path = "../../../crates/teamarness-package-sdk" }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
teamarness-package-sdk = { path = "../../../crates/teamarness-package-sdk", features = ["testing"] }
tempfile.workspace = true