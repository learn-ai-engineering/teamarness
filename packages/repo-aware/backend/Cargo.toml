[package]
name = "teamarness-repo-aware-package"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Per-repository walk rendezvous for out-of-crate tests, never enabled by normal builds.
test-hooks = []

[dependencies]
chrono.workspace = true
gix.workspace = true
serde.workspace = true
serde_json.workspace = true
teamarness-package-protocol = { path = "../../../crates/teamarness-package-protocol" }
teamarness-package-sdk = { path = "../../../crates/teamarness-package-sdk" }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
teamarness-repo-aware-package = { path = ".", features = ["test-hooks"] }
teamarness-package-sdk = { path = "../../../crates/teamarness-package-sdk", features = ["testing"] }
tempfile.workspace = true