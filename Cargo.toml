[workspace]
members = ["crates/resonance-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iroh-base = { version = "=1.2.0", default-features = false, features = ["key"] }
p2panda-auth = "=0.7.1"
p2panda-core = "=0.7.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
