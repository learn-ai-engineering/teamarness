[workspace]
members = [
    "apps/teamarness-desktop/src-tauri",
    "crates/teamarness-core",
    "crates/teamarness-package-host",
    "crates/teamarness-package-protocol",
    "crates/teamarness-package-sdk",
    "packages/reference-package/backend",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3", features = ["std"] }
iroh = "=1.2.0"
iroh-base = { version = "=1.2.0", default-features = false, features = ["key"] }
iroh-tickets = "=1.0.0"
jsonschema = { version = "=0.56.0", default-features = false }
mime = "=0.3.17"
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
p2panda-auth = "=0.7.1"
p2panda-core = "=0.7.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
