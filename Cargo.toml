[workspace]
members = ["crates/resonance-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iroh = "=1.2.0"
iroh-base = { version = "=1.2.0", default-features = false, features = ["key"] }
iroh-tickets = "=1.0.0"
p2panda-auth = "=0.7.1"
p2panda-core = "=0.7.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
