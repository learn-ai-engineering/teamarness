{
  "name": "Checks",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main",
        "ci/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "checks": {
      "runs-on": "ubuntu-24.04",
      "permissions": {
        "contents": "read"
      },
      "env": {
        "CI": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "node-version": "24.20.0"
          }
        },
        {
          "name": "Install exact Rust formatter",
          "run": "rustup toolchain install 1.99.1 --profile minimal --component rustfmt\nrustup override set 1.99.1"
        },
        {
          "name": "Check formatting, guards, types, lint and fast tests",
          "run": "npm run check:fast"
        }
      ]
    }
  }
}
