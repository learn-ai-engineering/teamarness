[package]
name = "teamarness-system-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Conversations Backend these tests drive is built here, as a bin target of
# this crate, from the Package's own `src/main.rs`. Cargo therefore rebuilds it
# as a prerequisite of every test binary below, and `CARGO_BIN_EXE_*` hands the
# harness a path that is current by construction. Reading a prebuilt artifact
# instead let a Backend regression pass these tests unnoticed (CR-012). ARC-10
# is unaffected: the dependency points from the tests to the Package, never the
# other way, and the Package still depends only on the SDK and the protocol.
[[bin]]
name = "conversations-backend-under-test"
path = "../../packages/conversations-package/backend/src/main.rs"

[[bin]]
name = "conversations-port-consumer-under-test"
path = "src/bin/conversations_port_consumer.rs"

# The Documents Backend is built the same way, from the Package's own `src/main.rs`.
[[bin]]
name = "documents-backend-under-test"
path = "../../packages/documents-package/backend/src/main.rs"

[[bin]]
name = "documents-port-consumer-under-test"
path = "src/bin/documents_port_consumer.rs"

[dependencies]
teamarness-conversations-package = { path = "../../packages/conversations-package/backend" }
teamarness-documents-package = { path = "../../packages/documents-package/backend" }
teamarness-package-sdk = { path = "../../crates/teamarness-package-sdk" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
base64.workspace = true
loro.workspace = true
sha2.workspace = true
# `test-hooks` is what binds an Installation's Iroh endpoint to loopback, so
# the default suite reaches no public relay. It is a dev-dependency: the
# feature never ships in the application.
teamarness-core = { path = "../../crates/teamarness-core", features = ["test-hooks"] }
teamarness-package-host = { path = "../../crates/teamarness-package-host" }
teamarness-package-protocol = { path = "../../crates/teamarness-package-protocol" }
tempfile.workspace = true
tokio.workspace = true
