[package]
name = "teamarness-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "teamarness_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
teamarness-core = { path = "../../../crates/teamarness-core" }
teamarness-package-host = { path = "../../../crates/teamarness-package-host" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true

[dev-dependencies]
sha2.workspace = true
# Every test Installation binds loopback with no address lookup, so no test
# here reaches the public internet. `check-core-module-graph.mjs` holds the
# feature to this table.
teamarness-core = { path = "../../../crates/teamarness-core", features = ["test-hooks"] }
tempfile.workspace = true
