[package]
name = "teamarness-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "teamarness_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[example]]
name = "qualify-update"
test = true

[features]
production-release = []
# Disposable Ready candidate and non-destructive terminal adapter; never production.
ui-isolation-probe = []

[build-dependencies]
tauri-build.workspace = true
base64.workspace = true
serde_json.workspace = true

[dependencies]
teamarness-core = { path = "../../../crates/teamarness-core" }
teamarness-package-host = { path = "../../../crates/teamarness-package-host" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-updater.workspace = true
reqwest.workspace = true
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
semver.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tauri = { workspace = true, features = ["test"] }
sha2.workspace = true
# Every test Installation binds loopback with no address lookup, so no test
# here reaches the public internet. `check-core-module-graph.mjs` holds the
# feature to this table.
teamarness-core = { path = "../../../crates/teamarness-core", features = ["test-hooks"] }
tempfile.workspace = true
