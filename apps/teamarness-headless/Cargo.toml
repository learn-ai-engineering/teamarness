[package]
name = "teamarness-headless"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
teamarness-core = { path = "../../crates/teamarness-core" }
teamarness-package-host = { path = "../../crates/teamarness-package-host" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
teamarness-core = { path = "../../crates/teamarness-core", features = ["test-hooks"] }
tempfile.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
