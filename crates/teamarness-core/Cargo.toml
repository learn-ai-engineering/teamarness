[package]
name = "teamarness-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
p2panda-sync-adapter = []
# Observation hooks for tests in other crates. Enabled only from a
# `[dev-dependencies]` entry; it never re-exposes production API.
test-hooks = []

[dependencies]
curve25519-dalek.workspace = true
hpke-rs.workspace = true
hpke-rs-crypto.workspace = true
hpke-rs-rust-crypto.workspace = true
iroh.workspace = true
iroh-base.workspace = true
iroh-tickets.workspace = true
p2panda-auth.workspace = true
p2panda-core.workspace = true
p2panda-encryption.workspace = true
p2panda-sync.workspace = true
p2panda-store.workspace = true
futures-util.workspace = true
postcard.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
